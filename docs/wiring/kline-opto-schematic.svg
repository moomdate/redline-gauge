<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16202a"/></pattern><style>text{font-family:Arial,sans-serif}.t{font-family:'Arial Narrow',Arial,sans-serif;font-weight:700}.m{font-family:Menlo,Consolas,monospace}.w{fill:none;stroke:#c9d3da;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.k{fill:none;stroke:#ff8a00;stroke-width:3.5;stroke-linejoin:round}.v{fill:none;stroke:#ff4747;stroke-width:3.5;stroke-linejoin:round}.g{fill:none;stroke:#9aa5ae;stroke-width:3.5;stroke-linejoin:round}.rx{fill:none;stroke:#b6ff00;stroke-width:3.5;stroke-linejoin:round}.tx{fill:none;stroke:#4fd2ff;stroke-width:3.5;stroke-linejoin:round}.p3{fill:none;stroke:#ffc400;stroke-width:3.5;stroke-linejoin:round}.r{fill:#182028;stroke:#e6edf2;stroke-width:2}.muted{fill:#8796a0}.lbl{fill:white}</style></defs>
<rect width="1400" height="880" fill="#0b0f13"/><rect x="24" y="24" width="1352" height="832" rx="16" fill="url(#g)" stroke="#27333c" stroke-width="2"/>
<path d="M24 100V40q0-16 16-16h250" fill="none" stroke="#ff8a00" stroke-width="5"/>
<text x="56" y="74" fill="white" font-size="32" class="t">DIY OPTO-ISOLATED K-LINE INTERFACE (2 × PC817 + 2N7000) → CYD</text>
<text x="56" y="100" class="muted" font-size="17">For HONDA K mode · the line is inverted by the optos: set  klineinvert=on  over serial (saved)</text>

<!-- isolation barrier -->
<path d="M700 130V700" stroke="#ff4747" stroke-width="2" stroke-dasharray="10 8"/>
<text class="m" x="700" y="124" text-anchor="middle" fill="#ff8080" font-size="14">ISOLATION BARRIER</text>
<text class="m" x="360" y="150" text-anchor="middle" fill="#ff9a9a" font-size="15">BIKE SIDE (12 V, bike GND)</text>
<text class="m" x="1040" y="150" text-anchor="middle" fill="#e8dc8a" font-size="15">CYD SIDE (3.3 V, CYD GND)</text>

<!-- DLC pins -->
<rect x="56" y="180" width="150" height="250" rx="12" fill="#3a0f12" stroke="#ff3b3b" stroke-width="2.5"/>
<text class="m" x="70" y="206" fill="#ff8080" font-size="14">HONDA DLC</text>
<text class="m" x="70" y="246" fill="#ff6b6b" font-size="14">4 +12V sw</text>
<text class="m" x="70" y="326" fill="#ff8a00" font-size="14">2 K-LINE</text>
<text class="m" x="70" y="406" fill="#c9d3da" font-size="14">1 GND</text>

<!-- +12V rail -->
<path class="v" d="M206 240H600"/>
<text class="m" x="590" y="232" text-anchor="end" fill="#ff9a9a" font-size="13">+12V</text>
<!-- bike GND rail -->
<path class="g" d="M206 400H230V660H640"/>
<text class="m" x="250" y="680" fill="#9aa5ae" font-size="13">GND (bike)</text>

<!-- K bus -->
<path class="k" d="M206 320H560"/>
<circle cx="300" cy="320" r="5" fill="#ff8a00"/><circle cx="420" cy="320" r="5" fill="#ff8a00"/><circle cx="560" cy="320" r="5" fill="#ff8a00"/>

<!-- R1 pull-up 12V -> K -->
<path class="v" d="M300 240V256"/><rect class="r" x="284" y="256" width="32" height="48" rx="4"/><path class="k" d="M300 304V320"/>
<text class="m lbl" x="324" y="276" font-size="13">R1 510 Ω</text><text class="m muted" x="324" y="294" font-size="12">½ W pull-up</text>

<!-- RX branch: K -> R2 -> U1 LED -> GND bike -->
<path class="k" d="M420 320V352"/><rect class="r" x="404" y="352" width="32" height="48" rx="4"/>
<text class="m lbl" x="444" y="372" font-size="13">R2 2.2 kΩ</text>
<path class="w" d="M420 400V430H640"/>
<path class="g" d="M610 500H640"/>

<!-- U1 PC817 (RX) -->
<rect x="640" y="410" width="120" height="110" rx="10" fill="#141c24" stroke="#b6ff00" stroke-width="2.5"/>
<text class="m" x="700" y="402" text-anchor="middle" fill="#b6ff00" font-size="14">U1 PC817 (RX)</text>
<path d="M648 440h32l-16 24z" fill="#b6ff00"/><path d="M648 464h32" stroke="#b6ff00" stroke-width="3"/>
<path d="M686 452l10-6m-10 14l10-6" stroke="#b6ff00" stroke-width="2"/>
<path d="M664 430v10m0 24v36" stroke="#c9d3da" stroke-width="2.5"/>
<text class="m" x="648" y="512" fill="#c9d3da" font-size="11">A   K</text>
<path d="M730 440v40m0-20l20-14m-20 22l20 14" stroke="#e6edf2" stroke-width="2.5" fill="none"/>
<text class="m" x="742" y="432" fill="#c9d3da" font-size="11">C</text><text class="m" x="742" y="506" fill="#c9d3da" font-size="11">E</text>
<path class="g" d="M610 500V660"/>
<!-- D1 reverse across U1 LED -->
<path class="w" d="M590 430V448"/><path d="M578 470l12-20l12 20z" fill="none" stroke="#e6edf2" stroke-width="2"/><path d="M578 450h24" stroke="#e6edf2" stroke-width="2"/><path class="g" d="M590 470V500H610"/>
<text class="m lbl" x="520" y="470" font-size="12">D1</text><text class="m muted" x="490" y="488" font-size="11">1N4148</text>

<!-- U1 output -> GPIO22 with pull-up -->
<path class="rx" d="M750 426H900"/><path class="g" d="M750 494H780V720"/>
<rect class="r" x="884" y="330" width="32" height="48" rx="4"/><path class="p3" d="M900 300V330"/><path class="rx" d="M900 378V426"/>
<text class="m lbl" x="924" y="350" font-size="13">R3 1.5 kΩ</text><text class="m muted" x="924" y="368" font-size="12">to 3.3 V</text>
<circle cx="900" cy="426" r="5" fill="#b6ff00"/><path class="rx" d="M900 426H1140"/>

<!-- TX branch: GPIO27 -> R4 -> U2 LED -> CYD GND -->
<path class="tx" d="M1140 560H930"/><rect class="r" x="882" y="544" width="48" height="32" rx="4"/>
<text class="m lbl" x="878" y="536" font-size="13">R4 220 Ω</text>
<path class="tx" d="M882 560H760"/>
<!-- U2 PC817 (TX) -->
<rect x="640" y="540" width="120" height="110" rx="10" fill="#141c24" stroke="#4fd2ff" stroke-width="2.5"/>
<text class="m" x="700" y="672" text-anchor="middle" fill="#4fd2ff" font-size="14">U2 PC817 (TX)</text>
<path d="M720 566h32l-16 24z" fill="#4fd2ff"/><path d="M720 590h32" stroke="#4fd2ff" stroke-width="3"/>
<path d="M714 578l-10-6m10 14l-10-6" stroke="#4fd2ff" stroke-width="2"/>
<text class="m" x="724" y="640" fill="#c9d3da" font-size="11">A   K</text>
<path class="g" d="M736 600V630H780"/>
<path d="M670 566v40m0-20l-20-14m20 22l-20 14" stroke="#e6edf2" stroke-width="2.5" fill="none"/>
<text class="m" x="648" y="560" fill="#c9d3da" font-size="11">C</text><text class="m" x="648" y="636" fill="#c9d3da" font-size="11">E</text>
<!-- U2 collector to +12V, emitter to gate -->
<path class="v" d="M600 240V560H650"/><path class="w" d="M650 620H520"/>

<!-- Q1 2N7000 -->
<rect x="436" y="560" width="84" height="80" rx="8" fill="#141c24" stroke="#ff8a00" stroke-width="2.5"/>
<text class="m" x="478" y="594" text-anchor="middle" fill="#ff8a00" font-size="13">Q1</text><text class="m" x="478" y="614" text-anchor="middle" fill="white" font-size="12">2N7000</text>
<text class="m" x="526" y="612" fill="#c9d3da" font-size="11">G</text><text class="m" x="484" y="554" fill="#c9d3da" font-size="11">D</text><text class="m" x="484" y="656" fill="#c9d3da" font-size="11">S</text>
<path class="k" d="M560 320V520H478V560"/><path class="g" d="M478 640V660"/>
<!-- R5 gate pulldown + ZD1 -->
<circle cx="540" cy="620" r="5" fill="#e6edf2"/><path class="w" d="M540 620V632"/><rect class="r" x="524" y="632" width="32" height="20" rx="3"/><path class="g" d="M540 652V660"/>
<text class="m lbl" x="330" y="720" font-size="12">R5 4.7 kΩ gate → GND</text>
<text class="m lbl" x="330" y="738" font-size="12">ZD1 15 V gate → GND (optional, spikes)</text>

<!-- CYD -->
<rect x="1140" y="280" width="200" height="400" rx="16" fill="#5d5200" stroke="#ffc400" stroke-width="3"/>
<text class="m" x="1160" y="312" fill="white" font-size="15">CYD  CN1</text>

<text class="m" x="1160" y="430" fill="#b6ff00" font-size="15">GPIO 22  RX</text>
<text class="m" x="1160" y="564" fill="#4fd2ff" font-size="15">GPIO 27  TX</text>

<text class="m" x="1160" y="350" fill="#ffc400" font-size="15">3.3 V</text>
<text class="m" x="1160" y="664" fill="white" font-size="15">GND</text>
<path class="p3" d="M900 300V286H1060V346H1140"/>
<path class="g" d="M780 720H1060V660H1140"/>

<!-- logic table -->
<rect x="56" y="760" width="640" height="84" rx="10" fill="#11181e" stroke="#53616b" stroke-width="2"/>
<text class="m" x="72" y="786" fill="#b6ff00" font-size="13">RX: K high (idle) → U1 on → GPIO22 LOW   · K low → GPIO22 HIGH</text>
<text class="m" x="72" y="808" fill="#4fd2ff" font-size="13">TX: GPIO27 HIGH → U2 on → Q1 on → K LOW  · GPIO27 LOW → K released</text>
<text class="m" x="72" y="830" fill="#ffc400" font-size="13">Both inverted → firmware: klineinvert=on · CYD off/reset → Q1 off → K free</text>
<rect x="720" y="760" width="636" height="84" rx="10" fill="#11181e" stroke="#53616b" stroke-width="2"/>
<text class="m" x="736" y="786" fill="white" font-size="13">Power the CYD from USB or an ISOLATED 12→5 V DC-DC.</text>
<text class="m" x="736" y="808" fill="white" font-size="13">Never join bike GND and CYD GND (that defeats the optos).</text>
<text class="m" x="736" y="830" fill="#8796a0" font-size="13">PC817 CTR ≥ 50 %: RX ~5 mA LED, TX ~9.5 mA LED (from GPIO)</text>
</svg>
